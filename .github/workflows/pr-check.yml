name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-version-bump:
    name: Check Version Bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, because the scope step below diffs this PR against main.
          fetch-depth: 0

      - name: Determine whether this PR ships anything
        id: scope
        run: |
          # A PR that touches nothing in the release-audit manifest
          # (.security/scripts/audit-hash.js COMPONENTS) cannot change what a user
          # runs, so it has no version to record. Config, docs and dependency
          # bumps land here. Anything under src/ or in the build chain is still
          # gated by the comparison below.
          SHIPPED='^(src/|package\.json$|package-lock\.json$|SECURITY\.md$|build-standalone\.js$|class-list-builder-source\.html$|scripts/validate-build\.js$)'

          CHANGED=$(git diff --name-only origin/main...HEAD) || {
            echo "❌ Could not diff this PR against main"
            exit 1
          }

          echo "Files changed in this PR:"
          if [ -z "$CHANGED" ]; then
            echo "  (none)"
          else
            echo "$CHANGED" | sed 's/^/  /'
          fi

          if echo "$CHANGED" | grep -Eq "$SHIPPED"; then
            echo "ships=true" >> $GITHUB_OUTPUT
            echo "→ shipped files changed: version bump required"
          else
            echo "ships=false" >> $GITHUB_OUTPUT
            echo "→ no shipped files changed: version bump not applicable"
          fi

      - name: Get PR version
        id: pr-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR package.json version: $VERSION"

      - name: Checkout main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: main-branch

      - name: Get main version
        id: main-version
        run: |
          VERSION=$(node -p "require('./main-branch/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $VERSION"

      - name: Get APP_VERSION from defaults.js
        id: app-version
        run: |
          APP_VERSION=$(grep -oP 'const APP_VERSION = "\K[^"]+' src/defaults.js)
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION in defaults.js: $APP_VERSION"

      - name: Compare versions
        run: |
          if [ "${{ steps.scope.outputs.ships }}" = "false" ]; then
            echo "✅ No shipped files changed — version bump not required for this PR."
            echo ""
            echo "The gate ties anything a user runs to a release audit. This PR only"
            echo "touches files outside the audit manifest, so there is no version to"
            echo "record. A PR that changes src/ or the build chain still hits the"
            echo "comparison below."
            exit 0
          fi

          PR_VERSION="${{ steps.pr-version.outputs.version }}"
          MAIN_VERSION="${{ steps.main-version.outputs.version }}"
          APP_VERSION="${{ steps.app-version.outputs.version }}"

          echo "Comparing versions:"
          echo "  PR version:     $PR_VERSION"
          echo "  Main version:   $MAIN_VERSION"
          echo "  APP_VERSION:    $APP_VERSION"

          # Check package.json version bump
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo ""
            echo "❌ ERROR: Version has not been bumped!"
            echo ""
            echo "Please update package.json version before merging:"
            echo "  1. Edit package.json and bump the version"
            echo "  2. Commit and push the change"
            echo ""
            echo "Version format: MAJOR.MINOR.PATCH"
            echo "  - Minor bump (e.g., 0.3.0 -> 0.4.0): Increment MINOR for new features"
            echo "  - Major bump (e.g., 0.3.0 -> 1.0.0): Increment MAJOR for breaking changes"
            exit 1
          fi

          # Check APP_VERSION matches package.json
          if [ "$PR_VERSION" != "$APP_VERSION" ]; then
            echo ""
            echo "❌ ERROR: Version mismatch between package.json and defaults.js!"
            echo ""
            echo "  package.json version:  $PR_VERSION"
            echo "  APP_VERSION:           $APP_VERSION"
            echo ""
            echo "Please update src/defaults.js to match package.json:"
            echo "  const APP_VERSION = \"$PR_VERSION\";"
            exit 1
          fi

          echo ""
          echo "✅ All versions consistent and bumped: $MAIN_VERSION -> $PR_VERSION"

  verify-audit:
    name: Verify Release Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify audit document
        run: node .security/scripts/verify-audit.js

      - name: Build standalone file
        run: node build-standalone.js

      - name: Generate SBOM (dry-run)
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          format: cyclonedx-json
          output-file: class-list-builder-v${{ steps.pr-version.outputs.version }}.cdx.json

      - name: Verify SBOM was generated
        run: |
          if [ ! -f "class-list-builder-v${{ steps.pr-version.outputs.version }}.cdx.json" ]; then
            echo "❌ SBOM was not generated"
            exit 1
          fi
          echo "✅ SBOM generated successfully"

name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build standalone file
        run: |
          node build-standalone.js

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: cyclonedx-json
          output-file: class-list-builder-v${{ steps.version.outputs.version }}.cdx.json
          artifact-name: class-list-builder-v${{ steps.version.outputs.version }}.cdx.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Check if tag already exists
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping"
            exit 0
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/class-list-builder-v*.html'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed

            This release includes the bundled standalone version of Class List Builder.

            ### Version v${{ steps.version.outputs.version }}

            ### Assets
            - **class-list-builder-v${{ steps.version.outputs.version }}.html** - Self-contained HTML file with all dependencies inlined. Works offline.

            ### Build Verification
            This release includes a signed build attestation. Verify with:
            ```bash
            gh attestation verify class-list-builder-v${{ steps.version.outputs.version }}.html --repo armstrys/class-list-builder
            ```

            ### SBOM
            A CycloneDX SBOM is included as a release asset for supply-chain verification.

            ### Usage
            Simply download and open the HTML file in any modern web browser. No internet connection required.
          files: |
            dist/class-list-builder-v${{ steps.version.outputs.version }}.html
            class-list-builder-v${{ steps.version.outputs.version }}.cdx.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Held apart from the routine dev bumps on purpose: this is the one
      # direct devDependency with a platform pin (cpu: x64), which is why a
      # local macOS/arm64 `npm ci` needs --force. Reviewed on its own diff.
      rolldown-binding:
        patterns:
          - '@rolldown/*'
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        # The first scheduled run (2026-11-14) put
        # @rolldown/binding-linux-x64-gnu inside this group instead of the
        # rolldown-binding group above, producing exactly the combined diff
        # the split was meant to prevent. The documented rule is that a
        # dependency joins the first group it matches, so the cause is not
        # confirmed; this exclusion makes the split hold either way.
        exclude-patterns:
          - '@rolldown/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
